name: Link Check
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress README.md
          fail: false
      - uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: lychee/out.md
